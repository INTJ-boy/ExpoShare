<body>

          <div class="es-lang-switch__menu">

        <a href="login.html" id="es-nav-login" class="es-btn es-btn--ghost es-btn--sm" data-i18n="nav.login">Log in</a>
        <a href="signup.html" id="es-nav-signup" class="es-btn es-btn--primary es-btn--sm" data-i18n="nav.signup">Sign up</a>
        <a href="#" id="es-nav-logout" class="es-btn es-btn--ghost es-btn--sm es-hidden" data-i18n="nav.logout">Log out</a>
        <button class="es-nav-toggle" id="es-nav-toggle" aria-expanded="false" aria-label="Menu">☰</button>

  <main class="es-main">

      <div class="es-skeleton" style="height:360px; border-radius:22px;"></div>

  <footer class="es-footer">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.13.216/legacy/build/pdf.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/lang-switch.js"></script>
<script>
(async function () {
  await window.i18n.init();
  await window.ExpoShareAuth.init();
  window.ExpoShare.markReady();
  window.ExpoShare.initMobileNav();
  window.ExpoShare.runLoadingSequence();

  if (window.pdfjsLib) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@2.13.216/legacy/build/pdf.worker.min.js";
  }

  const root = document.getElementById("es-pres-root");
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const sb = window.getSupabaseClient();
  if (!id || !sb) {
    root.innerHTML = `<div class="es-empty"><div class="es-empty__mascot">🦑</div><p>${window.i18n.t("errors.generic")}</p></div>`;
    return;
  }

  /**
   * Everything below can fail for reasons that have nothing to do with
   * a bug (a dropped mobile connection, a slow network, a transient
   * Supabase hiccup). Without this try/catch, any such failure was an
   * UNCAUGHT exception -- silently swallowed by the browser, leaving
   * the page stuck on its loading skeleton forever with no visible
   * error. Since that skeleton uses very dark gray tones against an
   * almost-black background, a page stuck there looks exactly like a
   * solid black screen in a screenshot. This ensures a failure always
   * becomes a visible, actionable error state instead.
   */
  try {
    await renderPresentation();
  } catch (err) {
    console.error(err);
    root.innerHTML = `
      <div class="es-empty">
        <div class="es-empty__mascot">🦑</div>
        <p>${window.i18n.t("errors.generic")}</p>
        <button type="button" class="es-btn es-btn--ghost es-btn--sm" id="es-pres-retry">${window.i18n.t("buttons.retry")}</button>
      </div>`;
    const retryBtn = document.getElementById("es-pres-retry");
    if (retryBtn) retryBtn.addEventListener("click", () => window.location.reload());
  }

  async function renderPresentation() {
  const taxonomy = await window.ExpoShare.loadTaxonomy();
  function label(list, id) {
    const item = list.find((x) => x.id === id);
    return item ? window.ExpoShare.taxonomyLabel(item, window.i18n.currentLang()) : id;
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s || "";
    return div.innerHTML;
  }

  const { data: row, error } = await sb
    .from("presentations")
    .select("*, owner:profiles(username, display_name)")
    .eq("id", id)
    .single();

  if (error || !row) {
    root.innerHTML = `<div class="es-empty"><div class="es-empty__mascot">🦑</div><p>${window.i18n.t("errors.generic")}</p></div>`;
    return;
  }

  // Reflect the actual presentation title in the tab and any social
  // preview generated from this specific page view.
  document.title = `${row.title} | ExpoShare`;
  const ogTitleEl = document.querySelector('meta[property="og:title"]');
  const twTitleEl = document.querySelector('meta[name="twitter:title"]');
  if (ogTitleEl) ogTitleEl.setAttribute("content", `${row.title} | ExpoShare`);
  if (twTitleEl) twTitleEl.setAttribute("content", `${row.title} | ExpoShare`);
  if (row.description) {
    const ogDescEl = document.querySelector('meta[property="og:description"]');
    const twDescEl = document.querySelector('meta[name="twitter:description"]');
    const shortDesc = row.description.length > 160 ? row.description.slice(0, 157) + "..." : row.description;
    if (ogDescEl) ogDescEl.setAttribute("content", shortDesc);
    if (twDescEl) twDescEl.setAttribute("content", shortDesc);
  }

  const field = taxonomy.fields.find((f) => f.id === row.field_id);
  const discipline = field && field.disciplines.find((d) => d.id === row.discipline_id);

  const coverUrl = row.cover_path
    ? sb.storage.from(window.EXPOSHARE_CONFIG.BUCKETS.covers).getPublicUrl(row.cover_path).data.publicUrl
    : window.ExpoShare.generateFallbackCover({ title: row.title, field: field ? label(taxonomy.fields, row.field_id) : row.field_id, format: row.format });

  const authorHtml = row.is_anonymous
    ? escapeHtml(window.i18n.t("presentation.anonymous"))
    : row.owner && row.owner.username
    ? `<a href="public-profile.html?username=${encodeURIComponent(row.owner.username)}" class="es-author-link">${escapeHtml(window.i18n.t("presentation.by", { author: row.owner.display_name || row.owner.username }))}</a>`
    : escapeHtml(window.i18n.t("presentation.by", { author: "" }));

  root.innerHTML = `
    <div id="es-pres-preview" class="es-preview" style="margin-bottom:24px;">
      <div class="es-card__cover" style="border-radius:22px;">
        <img src="${coverUrl}" alt="${escapeHtml(row.title)}" style="border-radius:22px;" />
      </div>
    </div>
    <div class="es-card__eyebrow">${escapeHtml(label(taxonomy.fields, row.field_id))}${discipline ? " · " + escapeHtml(label(field.disciplines, row.discipline_id)) : ""}</div>
    <h1>${escapeHtml(row.title)}</h1>
    <p class="es-muted">${authorHtml}</p>
    <div class="es-card__meta es-mt-24" style="margin-bottom:20px;">
      <span class="es-badge">${(row.format || "").toUpperCase()}</span>
      <span class="es-badge">${row.language ? row.language.toUpperCase() : ""}</span>
      ${row.slide_count ? `<span class="es-badge">${row.slide_count} ${window.i18n.t("presentation.slides")}</span>` : ""}
      <span class="es-badge" id="es-pres-views">${window.i18n.t("presentation.views", { count: row.view_count || 0 })}</span>
      <span class="es-badge" id="es-pres-downloads">${window.i18n.t("presentation.downloads", { count: row.download_count || 0 })}</span>
    </div>
    <p>${escapeHtml(row.description || "")}</p>
    <div class="es-flex es-gap-8 es-flex-wrap" style="margin:20px 0;">
      ${(row.tags || []).map((t) => `<span class="es-badge">#${escapeHtml(t)}</span>`).join("")}
    </div>
    <div class="es-flex es-gap-12 es-flex-wrap">
      <button class="es-btn es-btn--primary" id="es-pres-download">${window.i18n.t("presentation.download_file")}</button>
      <button class="es-btn es-btn--ghost" id="es-pres-bookmark">${window.i18n.t("presentation.bookmark_add")}</button>
      <button class="es-btn es-btn--ghost" id="es-pres-share">${window.i18n.t("presentation.share")}</button>
      <button class="es-btn es-btn--ghost" id="es-pres-report">${window.i18n.t("buttons.report")}</button>
    </div>

    <div class="es-section__head" style="margin-top:48px;"><h2 data-i18n="presentation.related_title">Related presentations</h2></div>
    <div class="es-grid" id="es-pres-related"></div>
  `;

  // Content injected via innerHTML after the page's initial load isn't
  // automatically translated -- i18n.init() only processes the DOM
  // that existed when it ran. This is what left "Related presentations"
  // in English even in French/Arabic mode: it has a data-i18n attribute,
  // but nothing ever told the translator to look at it.
  window.i18n.apply(root);

  renderPreview(row);
  incrementViewCount(row.id);
  initBookmark(row.id);
  loadRelated(row);

  document.getElementById("es-pres-download").addEventListener("click", async () => {
    // Opening the blank tab HERE, before any await, is deliberate: on
    // mobile Chrome, calling window.open() after an await breaks the
    // "trusted user gesture" requirement, and the browser silently
    // hijacks the CURRENT tab instead of opening a new one -- which
    // kills this function mid-execution before the signed URL even
    // resolves, let alone before the download counter below runs. A
    // tab opened synchronously, then redirected once the signed URL
    // is ready, avoids that entirely and keeps this tab alive.
    const newTab = window.open("", "_blank", "noopener");
    try {
      const { data, error } = await sb.storage.from(window.EXPOSHARE_CONFIG.BUCKETS.presentations).createSignedUrl(row.file_path, 60);
      if (error) throw error;
      if (newTab) {
        newTab.location.href = data.signedUrl;
      } else {
        // Popup blocked even for the synchronous blank open (rare, but
        // some browsers block all popups regardless) -- fall back to
        // navigating in place so the download still happens.
        window.location.href = data.signedUrl;
      }
      const { error: rpcError } = await sb.rpc("increment_download_count", { presentation_id: row.id });
      if (!rpcError) {
        const el = document.getElementById("es-pres-downloads");
        row.download_count = (row.download_count || 0) + 1;
        if (el) el.textContent = window.i18n.t("presentation.downloads", { count: row.download_count });
      }
    } catch (err) {
      if (newTab) newTab.close();
      window.ExpoShare.toast(err.message || window.i18n.t("errors.generic"), { type: "error" });
    }
  });

  document.getElementById("es-pres-share").addEventListener("click", async () => {
    const url = window.location.href;
    if (navigator.share) {
      try {
        await navigator.share({ title: row.title, url });
        return;
      } catch (e) {
        /* user cancelled the native share sheet; fall through to copy */
      }
    }
    try {
      await navigator.clipboard.writeText(url);
      window.ExpoShare.toast(window.i18n.t("presentation.link_copied"), { type: "success" });
    } catch (e) {
      /* clipboard API unavailable; silently ignore */
    }
  });

  /* ------------------------------------------------------------- Preview */

  function renderPreview(row) {
    const wrap = document.getElementById("es-pres-preview");
    if (row.format !== "pdf" && row.format !== "ppt" && row.format !== "pptx") return;

    wrap.innerHTML = `<div class="es-skeleton" style="height:520px; border-radius:22px;"></div>`;

    sb.storage
      .from(window.EXPOSHARE_CONFIG.BUCKETS.presentations)
      .createSignedUrl(row.file_path, 3600)
      .then(({ data, error }) => {
        if (error || !data) {
          wrap.innerHTML = `<p class="es-field__hint" data-i18n="presentation.no_preview">${window.i18n.t("presentation.no_preview")}</p>`;
          return;
        }
        if (row.format === "pdf") {
          renderPdfCanvas(wrap, data.signedUrl, row.title);
        } else {
          // PPT/PPTX: no reliable pure-JS renderer exists (unlike PDF,
          // there's no equivalent to PDF.js), so this embeds Google's
          // public document viewer pointed at our short-lived signed
          // URL. It's a genuine live preview, not a fake one -- but it
          // depends on a third-party service and can be slow or
          // blocked by some browsers, hence the hint below it.
          const viewerUrl = `https://docs.google.com/gview?url=${encodeURIComponent(data.signedUrl)}&embedded=true`;
          wrap.innerHTML = `
            <iframe src="${viewerUrl}" class="es-preview__frame" title="${escapeHtml(row.title)}"></iframe>
            <p class="es-field__hint" style="margin-top:10px;">${window.i18n.t("presentation.preview_unavailable_office")}</p>
          `;
        }
      });
  }

  /**
   * Renders a PDF page-by-page onto a <canvas> using PDF.js instead of
   * an <iframe src="...pdf">. Embedding PDFs via iframe is well-known
   * to be unreliable specifically on Chrome for Android/mobile
   * WebViews -- it commonly shows a blank or solid-black frame instead
   * of the document, because it depends on the browser's own internal
   * PDF plugin rather than anything the page controls. Rendering with
   * our own canvas sidesteps that entirely, since nothing depends on
   * the browser having (or correctly running) a built-in PDF viewer.
   */
  function renderPdfCanvas(wrap, url, title) {
    if (!window.pdfjsLib) {
      wrap.innerHTML = `<p class="es-field__hint" data-i18n="presentation.no_preview">${window.i18n.t("presentation.no_preview")}</p>`;
      return;
    }

    wrap.innerHTML = `
      <div class="es-pdf-viewer">
        <div class="es-pdf-viewer__canvas-wrap">
          <canvas id="es-pdf-canvas" aria-label="${escapeHtml(title)}"></canvas>
        </div>
        <div class="es-pdf-viewer__controls">
          <button type="button" class="es-btn es-btn--ghost es-btn--sm" id="es-pdf-prev">‹</button>
          <span class="es-pdf-viewer__page-indicator" id="es-pdf-indicator">-</span>
          <button type="button" class="es-btn es-btn--ghost es-btn--sm" id="es-pdf-next">›</button>
        </div>
      </div>
    `;

    const canvas = document.getElementById("es-pdf-canvas");
    const ctx = canvas.getContext("2d");
    const indicator = document.getElementById("es-pdf-indicator");
    const prevBtn = document.getElementById("es-pdf-prev");
    const nextBtn = document.getElementById("es-pdf-next");

    let pdfDoc = null;
    let currentPage = 1;
    let rendering = false;

    function renderPage(num) {
      if (!pdfDoc || rendering) return;
      rendering = true;
      pdfDoc.getPage(num).then((page) => {
        const containerWidth = canvas.parentElement.clientWidth || 640;
        const unscaledViewport = page.getViewport({ scale: 1 });
        const scale = (containerWidth / unscaledViewport.width) * (window.devicePixelRatio || 1);
        const viewport = page.getViewport({ scale });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = "100%";
        canvas.style.height = "auto";
        page.render({ canvasContext: ctx, viewport }).promise.then(() => {
          rendering = false;
          indicator.textContent = `${num} / ${pdfDoc.numPages}`;
          prevBtn.disabled = num <= 1;
          nextBtn.disabled = num >= pdfDoc.numPages;
        });
      });
    }

    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage -= 1;
        renderPage(currentPage);
      }
    });
    nextBtn.addEventListener("click", () => {
      if (pdfDoc && currentPage < pdfDoc.numPages) {
        currentPage += 1;
        renderPage(currentPage);
      }
    });

    window.pdfjsLib
      .getDocument(url)
      .promise.then((pdf) => {
        pdfDoc = pdf;
        renderPage(1);
      })
      .catch(() => {
        wrap.innerHTML = `<p class="es-field__hint" data-i18n="presentation.no_preview">${window.i18n.t("presentation.no_preview")}</p>`;
      });
  }

  /* --------------------------------------------------------------- Views */

  function incrementViewCount(id) {
    // Best-effort; not awaited, never blocks rendering. De-duplicated
    // per browser tab via sessionStorage so refreshing doesn't inflate
    // the count on every reload.
    const key = `es_viewed_${id}`;
    if (sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, "1");
    sb.rpc("increment_view_count", { presentation_id: id }).catch(() => {});
  }

  /* ----------------------------------------------------------- Bookmarks */

  async function initBookmark(presentationId) {
    const btn = document.getElementById("es-pres-bookmark");
    if (!btn) return;
    const user = window.ExpoShareAuth.user();

    let bookmarked = false;
    if (user) {
      const { data } = await sb
        .from("bookmarks")
        .select("id")
        .eq("user_id", user.id)
        .eq("presentation_id", presentationId)
        .maybeSingle();
      bookmarked = !!data;
      setBookmarkLabel(btn, bookmarked);
    }

    btn.addEventListener("click", async () => {
      const current = window.ExpoShareAuth.user();
      if (!current) {
        window.ExpoShare.toast(window.i18n.t("presentation.sign_in_to_bookmark"), { type: "info" });
        setTimeout(() => (window.location.href = "login.html"), 900);
        return;
      }
      try {
        if (bookmarked) {
          await sb.from("bookmarks").delete().eq("user_id", current.id).eq("presentation_id", presentationId);
          bookmarked = false;
          window.ExpoShare.toast(window.i18n.t("presentation.bookmark_removed"), { type: "success" });
        } else {
          await sb.from("bookmarks").insert({ user_id: current.id, presentation_id: presentationId });
          bookmarked = true;
          window.ExpoShare.toast(window.i18n.t("presentation.bookmark_added"), { type: "success" });
        }
        setBookmarkLabel(btn, bookmarked);
      } catch (err) {
        window.ExpoShare.toast(err.message || window.i18n.t("errors.generic"), { type: "error" });
      }
    });
  }

  function setBookmarkLabel(btn, bookmarked) {
    btn.textContent = window.i18n.t(bookmarked ? "presentation.bookmark_remove" : "presentation.bookmark_add");
    btn.classList.toggle("es-btn--primary", bookmarked);
    btn.classList.toggle("es-btn--ghost", !bookmarked);
  }

  /* -------------------------------------------------------------- Related */

  async function loadRelated(row) {
    const el = document.getElementById("es-pres-related");
    if (!el) return;
    const { data } = await sb
      .from("presentations")
      .select("id, title, field_id, format, cover_path")
      .eq("status", "approved")
      .eq("field_id", row.field_id)
      .neq("id", row.id)
      .limit(4);
    if (!data || !data.length) {
      el.parentElement.classList.add("es-hidden");
      return;
    }
    el.innerHTML = "";
    data.forEach((r) => {
      const cover = r.cover_path
        ? sb.storage.from(window.EXPOSHARE_CONFIG.BUCKETS.covers).getPublicUrl(r.cover_path).data.publicUrl
        : window.ExpoShare.generateFallbackCover({ title: r.title, field: label(taxonomy.fields, r.field_id), format: r.format });
      const a = document.createElement("a");
      a.href = `presentation.html?id=${r.id}`;
      a.className = "es-card";
      a.innerHTML = `<div class="es-card__cover"><img src="${cover}" alt="${escapeHtml(r.title)}" loading="lazy"/></div><div class="es-card__body"><div class="es-card__title">${escapeHtml(r.title)}</div></div>`;
      el.appendChild(a);
    });
  }

  document.getElementById("es-pres-report").addEventListener("click", async () => {
    const categories = ["copyright", "incorrect", "spam", "inappropriate", "wrong_category", "misleading", "duplicate", "other"];
    const optionsHtml = categories.map((c) => `<option value="${c}">${window.i18n.t("reports.category_" + c)}</option>`).join("");
    const bodyHtml = `
      <div class="es-field">
        <label>${window.i18n.t("reports.category")}</label>
        <select class="es-select" id="es-report-category">${optionsHtml}</select>
      </div>
      <div class="es-field">
        <label>${window.i18n.t("reports.explanation")}</label>
        <textarea class="es-textarea" id="es-report-explanation"></textarea>
      </div>
      <p class="es-field__hint">${window.i18n.t("reports.reporter_hidden")}</p>`;
    const confirmed = await window.ExpoShare.openModal({
      title: window.i18n.t("reports.title"),
      bodyHtml,
      actions: [
        { label: window.i18n.t("buttons.cancel"), value: false, variant: "ghost" },
        { label: window.i18n.t("buttons.submit"), value: true, variant: "primary" }
      ]
    });
    if (!confirmed) return;
    if (!window.ExpoShareAuth.isLoggedIn()) {
      window.ExpoShare.toast(window.i18n.t("reports.sign_in_to_report"), { type: "info" });
      setTimeout(() => (window.location.href = "login.html"), 900);
      return;
    }
    try {
      const { error } = await sb.from("reports").insert({
        presentation_id: row.id,
        reporter_id: window.ExpoShareAuth.user().id,
        category: document.getElementById("es-report-category").value,
        explanation: document.getElementById("es-report-explanation").value.trim() || null
      });
      if (error) throw error;
      window.ExpoShare.toast(window.i18n.t("reports.submit_success"), { type: "success" });
    } catch (err) {
      window.ExpoShare.toast(err.message || window.i18n.t("errors.generic"), { type: "error" });
    }
  });
  } // end renderPresentation()
})();
</script>
