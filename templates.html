<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
(async function () {
  await window.i18n.init();
  await window.ExpoShareAuth.init();
  window.ExpoShare.markReady();
  window.ExpoShare.initMobileNav();
  window.ExpoShare.runLoadingSequence();

  const TEMPLATES = [
    { id: "scientific_minimal", fields: ["science"], structure: ["introduction", "objectives", "methodology", "results", "conclusion"] },
    { id: "microbiology_lab", fields: ["science"], structure: ["sample", "culture_conditions", "observations", "identification", "discussion"] },
    { id: "medical_review", fields: ["health-medicine"], structure: ["case_background", "clinical_findings", "differential_diagnosis", "management", "outcome"] },
    { id: "engineering_system", fields: ["engineering"], structure: ["problem_statement", "system_design", "specifications", "testing", "results"] },
    { id: "football_match_analysis", fields: ["sports"], structure: ["match_context", "tactical_setup", "key_moments", "statistics", "verdict"] },
    { id: "basketball_analysis", fields: ["sports"], structure: ["team_context", "offense_defense_scheme", "key_plays", "statistics", "verdict"] },
    { id: "bodybuilding_training_science", fields: ["sports"], structure: ["goal", "program_design", "nutrition", "progress_metrics", "adjustments"] },
    { id: "forensic_case", fields: ["forensic-science"], structure: ["case_summary", "evidence_collected", "analysis", "findings", "conclusion"] },
    { id: "business_brief", fields: ["economics-business"], structure: ["context", "problem", "options", "recommendation", "next_steps"] },
    { id: "academic_thesis", fields: ["interdisciplinary-studies"], structure: ["abstract", "literature_review", "methodology", "findings", "discussion"] },
    { id: "environmental_study", fields: ["environmental-sciences"], structure: ["site_description", "methodology", "data", "impact_assessment", "recommendations"] },
    { id: "technical_project", fields: ["engineering", "computer-science-it"], structure: ["overview", "architecture", "implementation", "testing", "results"] }
  ];

  const taxonomy = await window.ExpoShare.loadTaxonomy();

  function fieldLabel(id) {
    const f = taxonomy.fields.find((x) => x.id === id);
    return f ? window.ExpoShare.taxonomyLabel(f, window.i18n.currentLang()) : id;
  }

  function render() {
    const grid = document.getElementById("es-templates-grid");
    grid.innerHTML = "";
    TEMPLATES.forEach((t) => {
      const card = document.createElement("div");
      card.className = "es-card es-template-card";
      card.innerHTML = `
        <div class="es-card__cover" style="display:flex; align-items:center; justify-content:center; font-size:2.4rem;">🦑</div>
        <div class="es-card__body">
          <h3 class="es-card__title">${window.i18n.t("templates." + t.id)}</h3>
          <div class="es-card__eyebrow">${window.i18n.t("templates.recommended_fields")}</div>
          <div class="es-card__meta" style="margin-bottom:8px;">${t.fields.map((f) => `<span class="es-badge">${fieldLabel(f)}</span>`).join("")}</div>
          <div class="es-card__eyebrow">${window.i18n.t("templates.structure")}</div>
          <ul class="es-template-card__structure">${t.structure.map((s) => `<li>${window.i18n.t("sections." + s)}</li>`).join("")}</ul>
          <a href="upload.html" class="es-btn es-btn--ghost es-btn--sm" style="margin-top:auto;">${window.i18n.t("buttons.use_template")}</a>
        </div>`;
      grid.appendChild(card);
    });
  }
  render();
  window.i18n.onChange(render);
})();
</script>
</body>
