<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set new password | ExpoShare</title>
<meta name="description" content="Set a new password for your ExpoShare account." />
<meta name="theme-color" content="#020202" />
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://intj-boy.github.io/ExpoShare/update-password.html" />

<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="ExpoShare" />
<meta property="og:title" content="Set new password | ExpoShare" />
<meta property="og:description" content="Set a new password for your ExpoShare account." />
<meta property="og:image" content="https://intj-boy.github.io/ExpoShare/assets/icons/og-image.png" />
<meta property="og:url" content="https://intj-boy.github.io/ExpoShare/update-password.html" />
<meta property="og:locale" content="en_US" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Set new password | ExpoShare" />
<meta name="twitter:description" content="Set a new password for your ExpoShare account." />
<meta name="twitter:image" content="https://intj-boy.github.io/ExpoShare/assets/icons/og-image.png" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="es-page">
  <header class="es-header">
    <div class="es-header__inner">
      <a href="index.html" class="es-brand"><span class="es-brand__mascot">🦑</span><span>ExpoShare</span></a>
      <div class="es-header__spacer"></div>
      <div class="es-lang-switch" id="es-lang-switch">
        <button class="es-lang-switch__btn" id="es-lang-btn" aria-label="Language">🌐 <span id="es-lang-current">EN</span></button>
        <div class="es-lang-switch__menu">
          <button data-lang="en">English</button>
          <button data-lang="fr">Français</button>
          <button data-lang="ar">العربية</button>
        </div>
      </div>
    </div>
  </header>
  <main class="es-main">
    <div class="es-container">
      <div class="es-auth">
        <h1 data-i18n="auth.update_password_title">Set a new password</h1>
        <form id="es-update-password-form">
          <div class="es-field">
            <label data-i18n="auth.new_password">New password</label>
            <input class="es-input" id="es-update-password" type="password" required minlength="8" />
          </div>
          <div class="es-field">
            <label data-i18n="auth.confirm_password">Confirm password</label>
            <input class="es-input" id="es-update-password-confirm" type="password" required minlength="8" />
          </div>
          <button type="submit" class="es-btn es-btn--primary es-btn--block" id="es-update-password-submit" data-i18n="buttons.reset_password">Reset password</button>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/lang-switch.js"></script>
<script>
(async function () {
  await window.i18n.init();
  // Supabase auto-detects the recovery token from the URL fragment
  // (detectSessionInUrl: true in config.js) and creates a temporary
  // session for the updateUser() call below.
  await window.ExpoShareAuth.init();
  window.ExpoShare.markReady();
  window.ExpoShare.runLoadingSequence();

  document.getElementById("es-update-password-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("es-update-password-submit");
    const pwd = document.getElementById("es-update-password").value;
    const confirm = document.getElementById("es-update-password-confirm").value;
    if (pwd !== confirm) {
      window.ExpoShare.toast(window.i18n.t("errors.passwords_dont_match"), { type: "error" });
      return;
    }
    window.ExpoShare.setButtonLoading(btn, true);
    try {
      await window.ExpoShareAuth.updatePassword(pwd);
      window.ExpoShare.toast(window.i18n.t("success.password_updated"), { type: "success" });
      setTimeout(() => (window.location.href = "login.html"), 900);
    } catch (err) {
      window.ExpoShare.toast(err.message || window.i18n.t("errors.generic"), { type: "error" });
    } finally {
      window.ExpoShare.setButtonLoading(btn, false);
    }
  });
})();
</script>
</body>
</html>
