<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password | ExpoShare</title>
<meta name="description" content="Reset your ExpoShare account password." />
<meta name="theme-color" content="#020202" />
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://intj-boy.github.io/ExpoShare/forgot-password.html" />

<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="ExpoShare" />
<meta property="og:title" content="Forgot password | ExpoShare" />
<meta property="og:description" content="Reset your ExpoShare account password." />
<meta property="og:image" content="https://intj-boy.github.io/ExpoShare/assets/icons/og-image.png" />
<meta property="og:url" content="https://intj-boy.github.io/ExpoShare/forgot-password.html" />
<meta property="og:locale" content="en_US" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Forgot password | ExpoShare" />
<meta name="twitter:description" content="Reset your ExpoShare account password." />
<meta name="twitter:image" content="https://intj-boy.github.io/ExpoShare/assets/icons/og-image.png" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="es-page">
  <header class="es-header">
    <div class="es-header__inner">
      <a href="index.html" class="es-brand"><span class="es-brand__mascot">🦑</span><span>ExpoShare</span></a>
      <div class="es-header__spacer"></div>
      <div class="es-lang-switch" id="es-lang-switch">
        <button class="es-lang-switch__btn" id="es-lang-btn" aria-label="Language">🌐 <span id="es-lang-current">EN</span></button>
        <div class="es-lang-switch__menu">
          <button data-lang="en">English</button>
          <button data-lang="fr">Français</button>
          <button data-lang="ar">العربية</button>
        </div>
      </div>
    </div>
  </header>
  <main class="es-main">
    <div class="es-container">
      <div class="es-auth">
        <h1 data-i18n="auth.reset_title">Reset your password</h1>
        <p class="es-muted es-text-center" data-i18n="auth.reset_instructions">Enter your email and we'll send you a recovery link.</p>
        <form id="es-forgot-form">
          <div class="es-field">
            <label data-i18n="auth.email">Email</label>
            <input class="es-input" id="es-forgot-email" type="email" required />
          </div>
          <button type="submit" class="es-btn es-btn--primary es-btn--block" id="es-forgot-submit" data-i18n="buttons.send_reset_link">Send reset link</button>
        </form>
        <div class="es-auth__foot">
          <a href="login.html" data-i18n="nav.login" style="color:var(--candy);">Log in</a>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/lang-switch.js"></script>
<script>
(async function () {
  await window.i18n.init();
  await window.ExpoShareAuth.init();
  window.ExpoShare.markReady();
  window.ExpoShare.runLoadingSequence();

  document.getElementById("es-forgot-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("es-forgot-submit");
    window.ExpoShare.setButtonLoading(btn, true);
    try {
      await window.ExpoShareAuth.sendPasswordReset(document.getElementById("es-forgot-email").value.trim());
      window.ExpoShare.toast(window.i18n.t("success.reset_email_sent"), { type: "success" });
    } catch (err) {
      window.ExpoShare.toast(err.message || window.i18n.t("errors.generic"), { type: "error" });
    } finally {
      window.ExpoShare.setButtonLoading(btn, false);
    }
  });
})();
</script>
</body>
</html>
