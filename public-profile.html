<div class="es-page">
  <header class="es-header">
    <div class="es-header__inner">
      <a href="index.html" class="es-brand"><span class="es-brand__mascot">🦑</span><span>ExpoShare</span></a>

      </nav>
      <div class="es-header__spacer"></div>
      <div class="es-lang-switch" id="es-lang-switch">
        <button class="es-lang-switch__btn" id="es-lang-btn" aria-label="Language">🌐 <span id="es-lang-current">EN</span></button>
        <div class="es-lang-switch__menu">
          <button data-lang="en">English</button>
          <button data-lang="fr">Français</button>
          <button data-lang="ar">العربية</button>
        </div>
      </div>
    </div>

  <main class="es-main">
    <div class="es-container" id="es-public-profile" style="max-width:720px;">
      <div class="es-flex es-gap-12" style="align-items:center; margin-bottom:24px;">
        <img id="es-pp-avatar" class="es-avatar" alt="" src="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23080808%22/></svg>" />

          <h1 id="es-pp-display-name" style="margin-bottom:2px;"></h1>
          <p class="es-muted" id="es-pp-username" style="margin:0;"></p>
        </div>
      </div>
      <p id="es-pp-bio"></p>
      <p class="es-muted" id="es-pp-institution"></p>

      <div class="es-flex es-gap-12 es-flex-wrap" id="es-pp-links" style="margin-bottom:8px;"></div>
      <div class="es-flex es-gap-8 es-flex-wrap" id="es-pp-hobbies" style="margin-bottom:8px;"></div>

      <div class="es-rating-summary">
        <span class="es-stars" id="es-pp-rating-stars"></span>
        <span class="es-rating-summary__count" id="es-pp-rating-count"></span>
      </div>
      <div id="es-pp-rate-widget"></div>

      <div class="es-section__head" style="margin-top:32px;"><h2 data-i18n="profile.approved_presentations">Approved presentations</h2></div>
      <div class="es-grid" id="es-pp-presentations"></div>
    </div>
  </main>

  <footer class="es-footer">
